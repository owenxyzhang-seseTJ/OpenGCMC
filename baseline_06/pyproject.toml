[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poremc-research"
version = "0.6.0"
description = "Independent flexible-guest Monte Carlo engine with native batched energy kernels"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]
license = {text = "MIT"}
[project.optional-dependencies]
test = ["pytest>=7"]
report = ["matplotlib>=3.7", "scipy>=1.10"]
cuda = ["cupy-cuda12x>=13"]
ml = ["torch>=2.2"]
[project.scripts]
poremc = "poremc.cli:main"
poremc-thermo = "poremc.thermo_cli:main"
poremc-reactive = "poremc.reactive_cli:main"
[tool.setuptools]
packages = ["poremc"]
[tool.setuptools.package-data]
poremc = ["*.so", "*.dylib", "*.dll", "*.cu"]
